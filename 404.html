<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... | Lesedi Jonas</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
    <script>
        (function() {
            var path = window.location.pathname.toLowerCase();
            // Handle variations of git slides path
            if (path.indexOf('git') !== -1 || path.indexOf('slide') !== -1) {
                window.location.replace('/Git-slides/');
                return;
            }
            // Handle variations of portfolio path
            if (path.indexOf('portfolio') !== -1 || path.indexOf('resume') !== -1 || path.indexOf('cv') !== -1) {
                window.location.replace('/Portfolio%20site/');
                return;
            }
        })();
    </script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem;
            margin: 0;
        }
        .container {
            max-width: 480px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            color: #6366f1;
        }
        p {
            color: #94a3b8;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        a {
            display: inline-block;
            background: #6366f1;
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
        }
        a:hover {
            background: #4f46e5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you are looking for doesn't exist or has moved. Return to the projects hub to find what you need.</p>
        <a href="/">← Return to Projects Hub</a>
    </div>
</body>
</html>
